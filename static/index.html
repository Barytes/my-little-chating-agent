<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
        }

        /* Sidebar - Chat History */
        .sidebar {
            width: 280px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #0f3460;
        }

        .sidebar-header h2 {
            color: #e94560;
            font-size: 1.2rem;
        }

        .new-chat-btn {
            margin-top: 10px;
            padding: 10px 15px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #ff6b6b;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            background: #1a1a2e;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item:hover {
            background: #0f3460;
        }

        .chat-item.active {
            background: #0f3460;
            border-left: 3px solid #e94560;
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header h1 {
            font-size: 1.3rem;
            color: #e94560;
        }

        .model-select {
            padding: 8px 12px;
            background: #1a1a2e;
            color: #eee;
            border: 1px solid #0f3460;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .header-spacer {
            flex: 1;
        }

        .notes-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .notes-status {
            max-width: 220px;
            color: #b9c0d4;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .notes-btn {
            padding: 8px 12px;
            background: #0f3460;
            color: #eee;
            border: 1px solid #2c5f94;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: border-color 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .notes-btn:hover {
            background: #164674;
            border-color: #e94560;
        }

        .notes-btn:disabled {
            background: #33394d;
            border-color: #555b70;
            cursor: not-allowed;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            background: #e94560;
            align-self: flex-end;
        }

        .message.assistant {
            background: #0f3460;
            align-self: flex-start;
        }

        .message-label {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        /* Thinking Animation */
        .thinking {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
            background: #0f3460;
            border-radius: 12px;
            align-self: flex-start;
        }

        .thinking-dot {
            width: 10px;
            height: 10px;
            background: #e94560;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .thinking-dot:nth-child(1) { animation-delay: 0s; }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 15px;
            background: #1a1a2e;
            color: #eee;
            border: 1px solid #0f3460;
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        .message-input:focus {
            border-color: #e94560;
        }

        .send-btn {
            padding: 15px 25px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #ff6b6b;
        }

        .send-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Chat History</h2>
            <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-chat">
        <div class="chat-header">
            <h1>AI Agent Chat</h1>
            <select class="model-select" id="modelSelect">
                <option value="grok-4-fast">grok-4-fast</option>
                <option value="deepseek">deepseek</option>
                <option value="gpt-5">gpt-5</option>
                <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                <option value="kimi-k2.5">kimi-k2.5</option>
            </select>
            <div class="header-spacer"></div>
            <div class="notes-controls">
                <span class="notes-status" id="notesStatus">Notes: none</span>
                <button class="notes-btn" id="notesBtn" onclick="selectNotesDirectory()">Choose Notes</button>
                <input type="file" id="notesDirectoryInput" webkitdirectory directory multiple hidden>
            </div>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="empty-state">
                <h3>Start a conversation</h3>
                <p>Ask anything - the AI can search the web and read pages for you</p>
            </div>
        </div>

        <div class="input-area">
            <textarea class="message-input" id="messageInput" placeholder="Type your message..." rows="2"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000';
        let chats = [];
        let currentChatId = null;

        // Load chats from localStorage
        function loadChats() {
            const saved = localStorage.getItem('chats');
            if (saved) {
                chats = JSON.parse(saved);
                renderChatList();
                if (chats.length > 0) {
                    selectChat(chats[0].id);
                }
            }
        }

        // Save chats to localStorage
        function saveChats() {
            localStorage.setItem('chats', JSON.stringify(chats));
        }

        // Create new chat
        function createNewChat() {
            const chat = {
                id: Date.now().toString(),
                title: 'New Chat',
                messages: [],
                createdAt: new Date().toISOString()
            };
            chats.unshift(chat);
            saveChats();
            renderChatList();
            selectChat(chat.id);
        }

        // Render chat list
        function renderChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.textContent = chat.title;
                item.onclick = () => selectChat(chat.id);
                chatList.appendChild(item);
            });
        }

        // Select a chat
        function selectChat(chatId) {
            currentChatId = chatId;
            renderChatList();
            renderMessages();
        }

        // Get current chat
        function getCurrentChat() {
            return chats.find(c => c.id === currentChatId);
        }

        // Render messages
        function renderMessages() {
            const area = document.getElementById('messagesArea');
            const chat = getCurrentChat();

            if (!chat || chat.messages.length === 0) {
                area.innerHTML = `
                    <div class="empty-state">
                        <h3>Start a conversation</h3>
                        <p>Ask anything - the AI can search the web and read pages for you</p>
                    </div>
                `;
                return;
            }

            area.innerHTML = '';
            chat.messages.forEach(msg => {
                addMessageToDOM(msg.role, msg.content, false);
            });
            area.scrollTop = area.scrollHeight;
        }

        // Add message to DOM
        function addMessageToDOM(role, content, scroll = true) {
            const area = document.getElementById('messagesArea');

            // Remove empty state if present
            const emptyState = area.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `
                <div class="message-label">${role === 'user' ? 'You' : 'Assistant'}</div>
                <div class="message-content">${formatContent(content)}</div>
            `;
            area.appendChild(msgDiv);

            if (scroll) area.scrollTop = area.scrollHeight;
        }

        // Show thinking animation
        function showThinking() {
            const area = document.getElementById('messagesArea');
            const emptyState = area.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.id = 'thinkingIndicator';
            thinkingDiv.innerHTML = `
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
                <div class="thinking-dot"></div>
            `;
            area.appendChild(thinkingDiv);
            area.scrollTop = area.scrollHeight;
        }

        // Hide thinking animation
        function hideThinking() {
            const thinking = document.getElementById('thinkingIndicator');
            if (thinking) thinking.remove();
        }

        // Format content (basic markdown-like formatting)
        function formatContent(content) {
            // Escape HTML
            content = content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // Bold
            content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Code blocks
            content = content.replace(/`(.*?)`/g, '<code>$1</code>');
            // Line breaks
            content = content.replace(/\n/g, '<br>');
            return content;
        }

        function setNotesStatus(message) {
            document.getElementById('notesStatus').textContent = message;
        }

        function getSelectedDirectoryName(files) {
            if (!files.length) return 'notes';
            const relativePath = files[0].webkitRelativePath || files[0].name;
            return relativePath.split('/')[0] || 'notes';
        }

        async function loadNotesStatus() {
            try {
                const response = await fetch(`${BASE_URL}/notes/status`);
                const data = await response.json();
                if (data.active && data.active.notes_name) {
                    setNotesStatus(`Notes: ${data.active.notes_name}`);
                }
            } catch (error) {
                setNotesStatus('Notes: unavailable');
            }
        }

        function selectNotesDirectory() {
            document.getElementById('notesDirectoryInput').click();
        }

        async function trySelectExistingNotes(notesName) {
            const formData = new FormData();
            formData.append('notes_name', notesName);

            const response = await fetch(`${BASE_URL}/notes/select`, {
                method: 'POST',
                body: formData
            });

            if (response.status === 404) return null;
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || 'Failed to load notes index');
            }
            return data;
        }

        async function uploadAndIndexNotes(notesName, files) {
            const markdownFiles = Array.from(files).filter(file => file.name.toLowerCase().endsWith('.md'));
            if (markdownFiles.length === 0) {
                throw new Error('No Markdown files found in the selected directory');
            }

            const formData = new FormData();
            formData.append('notes_name', notesName);
            markdownFiles.forEach(file => {
                formData.append('files', file, file.webkitRelativePath || file.name);
            });

            const response = await fetch(`${BASE_URL}/notes/index`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || 'Failed to index notes');
            }
            return data;
        }

        async function handleNotesDirectorySelected(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const notesName = getSelectedDirectoryName(files);
            const notesBtn = document.getElementById('notesBtn');
            notesBtn.disabled = true;
            setNotesStatus(`Notes: checking ${notesName}`);

            try {
                let data = await trySelectExistingNotes(notesName);
                if (!data) {
                    setNotesStatus(`Notes: indexing ${notesName}`);
                    data = await uploadAndIndexNotes(notesName, files);
                }

                const activeName = data.active?.notes_name || data.notes_name || notesName;
                setNotesStatus(`Notes: ${activeName}`);
            } catch (error) {
                setNotesStatus(`Notes: ${error.message}`);
            } finally {
                notesBtn.disabled = false;
                event.target.value = '';
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const model = document.getElementById('modelSelect').value;
            const content = input.value.trim();

            if (!content) return;

            // Create new chat if none selected
            if (!currentChatId) {
                createNewChat();
            }

            const chat = getCurrentChat();

            // Add user message
            chat.messages.push({ role: 'user', content });
            addMessageToDOM('user', content);

            // Update chat title if first message
            if (chat.messages.length === 1) {
                chat.title = content.slice(0, 30) + (content.length > 30 ? '...' : '');
                renderChatList();
            }

            // Clear input and disable button
            input.value = '';
            sendBtn.disabled = true;

            // Show thinking animation
            showThinking();

            try {
                const response = await fetch(`${BASE_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model, message: content })
                });

                const data = await response.json();

                hideThinking();

                if (data.response) {
                    chat.messages.push({ role: 'assistant', content: data.response });
                    addMessageToDOM('assistant', data.response);
                    saveChats();
                } else if (data.detail) {
                    addMessageToDOM('assistant', `Error: ${data.detail}`);
                }
            } catch (error) {
                hideThinking();
                addMessageToDOM('assistant', `Error: ${error.message}`);
            }

            sendBtn.disabled = false;
            input.focus();
        }

        // Handle Enter key
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('notesDirectoryInput').addEventListener('change', handleNotesDirectorySelected);

        // Load models from API
        async function loadModels() {
            try {
                const response = await fetch(`${BASE_URL}/models`);
                const data = await response.json();
                const select = document.getElementById('modelSelect');

                select.innerHTML = '';
                data.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = model.id;
                    if (model.id === data.default) option.selected = true;
                    select.appendChild(option);
                });
            } catch (error) {
                console.log('Using default models');
            }
        }

        // Initialize
        loadChats();
        loadModels();
        loadNotesStatus();
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
