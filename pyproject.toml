[project]
name = "my-little-chatgpt"
version = "0.1.0"
description = "A FastAPI AI agent chat app with web search and local FAISS indexing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.uv]
package = false
